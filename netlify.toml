# Netlify: static site, nothing to build. The app is the public/ folder.
[build]
  publish = "public"

# Never let the service worker or shell go stale in a CDN cache; the SW itself caches for offline.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

# Functions: bundle with esbuild on Node 22 (needed by @netlify/blobs 11).
[functions]
  node_bundler = "esbuild"
[build.environment]
  AWS_LAMBDA_JS_RUNTIME = "nodejs22.x"
